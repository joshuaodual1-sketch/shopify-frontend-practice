<!DOCTYPE html>
<html>
    <head>
        <title>Display Practice</title>
        <link rel="stylesheet" href="styles/display-practice.css">
    </head>

    <body>

        <div>
            <input class="name" type="text" placeholder="Name">
            <input class="email" type="text" placeholder="Email">
        </div>

        <hr>

        <div class="custommer-care-page">
            <p class="custommer-care">
                Thanks for chatting with our custommer support. Would you like our quick survey?
            </p>

            <button class="yes-button">Yes</button>
            <button class=""no-button>No</button>
        </div>
        <hr>

        <div>
            <img class="google-banner" src="images\images.png" alt="">
            <input class="search-bar" placeholder="Search Google or type a URL" type="text">
        </div>

        <hr>

        <div class="form">
            <input type="text" name="first-name" id="first-name" placeholder="First name">
            <input type="text" name="first-name" id="last-name" placeholder="Last name">
            <input type="text" name="first-name" id="email" placeholder="Email">
            <button class="sign-up">Sign Up</button>
        </div>

        <hr>

        <div>
            <p class="uber">
                Request a ride now
            </p>
            <input type="text" id="uber-location" placeholder="Enter pickup location">
            <input type="text" id="uber-destination" placeholder="Enter destination">
            <button class="uber-request">Request now</button>
            <button class="uber-schedule">Schedule for later</button>
        </div>

        <hr>
        
    </body>
</html>
