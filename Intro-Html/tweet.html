<!DOCTYPE html>
<html>
	<head>
		<title>Tweeter clone</title>
		<link rel="stylesheet" href="styles/tweet.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	</head>

	<body>
		<div class="tweet">
			<div class="profile-pic-container">
				<img class="profile-pic" src="images/a793b7f54f5ae36b80e58db5aa445b60.jpg" alt="">
			</div>
			<div class="tweet-container">
				<div>
					<p  class="tweet-content">SuperSimple.dev <span class="username">&commat;SuperSimple.dev</span></p>
					<p class="tweet-text">What is backend web development? A complete overview. Next video is Up!</p>
				</div>
				<div class="video-link">
					<div class="whitespace"></div>
					<div class="link-description">
						<p class="domain">youtube.com</p>
						<p class="video-title">Backend Web development - a complete overview (2021)</p>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
