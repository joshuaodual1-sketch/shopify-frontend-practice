<!DOCTYPE html>

<html lang="en">
	<head>
		<Title>Youtube Clone</Title>
		<link rel="stylesheet" href="youtube.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	</head>

	<body>
		<input class="search-box" type="text" name="" id="" placeholder="Search">
		<div class="video-preview">
			<div class="thumbnail-container">
				<img class="thumbnail" src="thumbnails/thumbnail-1.webp" alt="thumbnail">
			</div>

			<div class="video-info-container">
				<div class="profile-pic-container">
					<img class="profile-pic" src="Profile-pics/channel-1.jpeg" alt="">
				</div>

				<div class="video-info">
					<p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>
					<p class="author-name">Marques Brownlee</p>
					<p class="author-stats">3.4M views &#183 6 months ago</p>
				</div>
				
			</div>
		</div>

		<div class="video-preview">
			<div class="thumbnail-container">
				<img class="thumbnail" src="thumbnails/thumbnail-2.webp" alt="thumbnail">
			</div>

			<div class="video-info-container">
				<div class="profile-pic-container">
					<img class="profile-pic" src="Profile-pics/channel-2.jpeg" alt="">
				</div>

				<div class="video-info">
					<p class="video-title">Try Not To Laugh Challenge #9</p>
					<p class="author-name">Markiplier</p>
					<p class="author-stats">19M views &#183 4 years ago</p>
				</div>
				
			</div>
		</div>
	</body>
</html>
